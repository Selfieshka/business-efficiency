services:
  postgres:
    container_name: database
    image: postgres:15
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    env_file:
      - env/.env
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata

  app:
    container_name: business-efficiency-app
    build:
      context: .
      dockerfile: be-impl/Dockerfile
    env_file:
      - env/.env
    depends_on:
      - postgres
    ports:
      - "8080:8080"

volumes:
  pgdata:


