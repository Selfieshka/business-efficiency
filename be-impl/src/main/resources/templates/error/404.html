<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            font-family: Arial, sans-serif;
        }

        .error-container {
            text-align: center;
            padding: 2rem;
            background: #fff;
            border-radius: 10px;
            border: 1px solid #dcdcdc;
            max-width: 600px;
            width: 90%;
        }

        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: #ffe8a3;
            margin-bottom: 1rem;
        }

        .error-message {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 2rem;
        }

        .home-button {
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 0.75rem 2rem;
            font-size: 1.1rem;
            transition: background-color 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .home-button:hover {
            background-color: black;
            color: white;
        }

        .text-muted {
            color: #555 !important;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-code">404</div>
    <div class="error-message">Такой странички нет</div>
    <p class="text-muted mb-4">Страницы не существует, либо она была удалена</p>
    <a th:href="@{/profile}" class="home-button">Вернуться в профиль</a>
</div>
</body>
</html>
