<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Профиль</title>
    <link rel="stylesheet" type="text/css" th:href="@{/style/profile.css}">
    <script defer th:src="@{/js/profile.js}"></script>
    <link rel="stylesheet" type="text/css" th:href="@{/style/_sidebar.css}">
    <script defer th:src="@{/js/_sidebar.js}"></script>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"/>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>
<body>

<div th:replace="~{parts/_sidebar :: sidebar}"></div>

<form method="POST" class="account" id="accountForm" th:action="@{/profile/update}">
    <div class="account-header">
        <h1 class="account-title">Настройки аккаунта</h1>
        <div class="btn-container">
            <button type="button" id="editButton" class="btn-edit">Редактировать</button>
            <button type="button" id="cancelButton" class="btn-cancel hidden">Отмена</button>
            <button type="submit" id="saveButton" class="btn-save hidden">Сохранить</button>
        </div>
    </div>
    <div class="account-edit">
        <div class="input-container">
            <label for="lastName">Фамилия</label>
            <input type="text" id="lastName" name="lastName" placeholder="Фамилия"
                   th:value="${owner.lastName}" readonly/>
        </div>
        <div class="input-container">
            <label for="firstName">Имя</label>
            <input type="text" id="firstName" name="firstName" placeholder="Имя"
                   th:value="${owner.firstName}" readonly/>
        </div>
        <div class="input-container">
            <label for="patronymic">Отчество</label>
            <input type="text" id="patronymic" name="patronymic" placeholder="Отчество"
                   th:value="${owner.patronymic}" readonly/>
        </div>
        <div class="input-container">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Email"
                   th:value="${owner.email}" readonly/>
        </div>
    </div>
    <div class="account-edit">
        <div class="input-container">
            <label for="age">Возраст</label>
            <input type="number" id="age" name="age" placeholder="Возраст"
                   th:value="${owner.age}" readonly/>
        </div>
        <div class="input-container">
            <label for="phoneNumber">Номер телефона</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Номер телефона"
                   th:value="${owner.phoneNumber}" readonly/>
        </div>
    </div>
</form>

<div th:replace="~{parts/_footer :: footer}"></div>

</body>
</html>
