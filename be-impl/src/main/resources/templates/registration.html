<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Регистрация</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" th:href="@{/style/registration.css}">
</head>
<body>

<div class="wrapper">
    <form method="POST" th:action="@{/registration}">
        <h2>Присоединяйтесь к нам,<br>создайте свой аккаунт</h2>
        <h1>Регистрация</h1>
        <div class="input-box">
            <input name="username" type="text" autocomplete="off" placeholder="Введите имя" required/>
        </div>
        <div class="input-box">
            <input name="businessName" type="text" autocomplete="off" placeholder="Введите название бизнеса" required/>
        </div>
        <div class="input-box">
            <input name="email" type="email" autocomplete="off" placeholder="Введите email"/>
        </div>
        <div class="input-box">
            <input name="password" type="password" autocomplete="off" minlength="5" placeholder="Придумайте пароль"
                   required/>
        </div>
        <button type="submit" class="btn">Зарегистрироваться</button>
        <div class="register-link">
            <p>Уже зарегистрировались? <a class="login" th:href="@{/login}">Войти</a></p>
        </div>
    </form>

    <div th:replace="~{fragments/errors :: errors}"></div>
</div>

</body>
</html>
