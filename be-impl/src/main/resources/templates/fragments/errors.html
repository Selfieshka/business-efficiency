<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="errors">
    <div class="message-box-error" th:if="${errors != null and not #lists.isEmpty(errors)}">
        <ul>
            <li th:each="error : ${errors}" th:text="${error}"></li>
        </ul>
    </div>
</div>

</body>
</html>
